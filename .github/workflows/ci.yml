name: PHP API Checks

on:
  pull_request:
  push:
    branches: [main, feat/mvp-daily-planning]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: rahdana_test
          MYSQL_USER: rahdana
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=test-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rahdana_test
      DB_USERNAME: rahdana
      DB_PASSWORD: test-password
      RAHDANA_TEST_DB: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find src bootstrap config public routes bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PayaCore unit tests
        run: composer test
      - name: Run migrations
        run: php bin/migrate.php
      - name: Integration tests
        run: php tests/integration.php
